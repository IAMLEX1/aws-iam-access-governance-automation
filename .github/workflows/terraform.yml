name: Terraform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          RESPONSE="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          TOKEN="$(echo "$RESPONSE" | jq -r '.value')"
          PAYLOAD="$(echo "$TOKEN" | cut -d '.' -f2)"
          python3 -c 'import base64,json,sys; p=sys.argv[1]; p += "=" * (-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); [print(f"{k}: {c.get(k)}") for k in ["sub","aud","repository","repository_owner","ref","event_name"]]' "$PAYLOAD"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::317287357336:role/GitHubActions-IAM-Governance
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var="aws_region=us-east-1"